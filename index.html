<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortbildung Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #eceef1; --ink: #1a1a1a; --muted: rgba(0,0,0,.55); --blue: #003d82; --accent: #2a78d6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); font-family: Nunito, system-ui, sans-serif; color: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: #fff; border-bottom: 1px solid rgba(0,0,0,.08); flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 16px; font-weight: 800; }
  .brand span { font-size: 13px; color: var(--muted); }
  .views { display: flex; background: #eef1f5; border-radius: 8px; padding: 4px; }
  .views button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 14px; color: #5f6368; padding: 7px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .views button.on { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .tools { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .tools a { color: #1565c0; font-weight: 700; text-decoration: none; }
  .tools a:hover { text-decoration: underline; }

  .stage { flex: 1; min-height: 0; display: flex; gap: 28px; padding: 18px 24px 20px; }
  .dev { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
  .dev-d { flex: 1; }
  .dev-m { flex: none; }
  .stage[data-view="desktop"] .dev-m, .stage[data-view="mobile"] .dev-d { display: none; }
  .stage[data-view="mobile"] { justify-content: center; }
  .dev-head { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); min-height: 26px; }
  .dev-name { font: 700 11px ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; padding: 3px 7px; background: var(--ink); color: #fff; border-radius: 4px; }
  .scr { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scr a { font: 600 10.5px ui-monospace, Menlo, monospace; padding: 3px 7px; background: rgba(0,0,0,.08); color: var(--ink); border-radius: 5px; text-decoration: none; }
  .scr a:hover { background: var(--accent); color: #fff; }
  .scr .new { font: 600 10.5px ui-monospace, Menlo, monospace; padding: 3px 7px; background: #fff3dc; color: #8a5a00; border-radius: 5px; }
  .reset { margin-left: auto; border: 1px solid rgba(0,0,0,.15); background: #fff; border-radius: 6px; font: inherit; font-size: 12.5px; font-weight: 700; padding: 4px 10px; cursor: pointer; color: #424242; flex: none; }
  .reset:hover { background: #f5f7fa; }
  .fit { flex: 1; min-height: 0; position: relative; }
  .scaled { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .browser { background: #fff; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); box-shadow: 0 8px 30px rgba(0,0,0,.12); overflow: hidden; display: flex; flex-direction: column; }
  .chrome { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #f1f3f6; border-bottom: 1px solid #e0e3e8; }
  .chrome i { width: 12px; height: 12px; border-radius: 50%; background: #d5d9df; display: block; }
  .chrome i:nth-child(1) { background: #ff5f57; } .chrome i:nth-child(2) { background: #febc2e; } .chrome i:nth-child(3) { background: #28c840; }
  .chrome .url { margin-left: 14px; flex: 1; max-width: 520px; background: #fff; border-radius: 6px; font-size: 12.5px; color: #5f6368; padding: 4px 12px; }
  .browser iframe { flex: 1; border: 0; width: 100%; display: block; }
  .phone { width: 406px; height: 860px; border-radius: 36px; border: 8px solid #1d1f23; background: #1d1f23; box-shadow: 0 10px 34px rgba(0,0,0,.22); overflow: hidden; }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; display: block; background: #fff; }
  @media (max-width: 720px) {
    .bar { padding: 10px 16px; }
    .brand span { display: none; }
    .stage { padding: 12px 16px; gap: 16px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>Bedarfserhebung · Klick-Mockup</b><span>Klickbar, ohne Speicherung – jede Ansicht läuft unabhängig.</span></div>
  <div class="views" role="tablist" aria-label="Ansicht">
    <button data-view="both" role="tab">Beide</button>
    <button data-view="desktop" role="tab">Desktop</button>
    <button data-view="mobile" role="tab">Mobile</button>
  </div>
  <div class="tools"><a href="design/Fortbildung%20UX.dc.html" target="_blank" rel="noopener">Design-Dokument ↗</a></div>
</header>

<main class="stage" id="stage" data-view="both">
  <section class="dev dev-d">
    <div class="dev-head"><span class="dev-name">Desktop</span><span class="scr" id="scr-desktop"></span><button class="reset" data-reset="desktop">↺ Neu starten</button></div>
    <div class="fit" id="fit-desktop">
      <div class="scaled browser" id="box-desktop">
        <div class="chrome"><i></i><i></i><i></i><span class="url">fortbildung.schule.de/bedarfserhebung</span></div>
        <iframe id="frame-desktop" src="app.html?device=desktop" title="Desktop-Ansicht"></iframe>
      </div>
    </div>
  </section>
  <section class="dev dev-m" id="dev-m">
    <div class="dev-head"><span class="dev-name">Mobile</span><span class="scr" id="scr-mobile"></span><button class="reset" data-reset="mobile">↺ Neu starten</button></div>
    <div class="fit" id="fit-mobile">
      <div class="scaled phone" id="box-mobile"><iframe id="frame-mobile" src="app.html?device=mobile" title="Mobile Ansicht"></iframe></div>
    </div>
  </section>
</main>

<script>
(() => {
  const stage = document.getElementById('stage');
  const DESIGN = 'design/Fortbildung%20UX.dc.html';
  const PHONE = { w: 406, h: 860 };
  const DESK_W = 1280;

  function layout() {
    const view = stage.dataset.view;
    // Mobile: Telefon so groß wie möglich, höchstens 1:1
    const fm = document.getElementById('fit-mobile');
    const bm = document.getElementById('box-mobile');
    const devM = document.getElementById('dev-m');
    if (view !== 'desktop') {
      const availH = fm.clientHeight;
      const availW = view === 'mobile' ? stage.clientWidth - 48 : Infinity;
      const s = Math.min(1, availH / PHONE.h, availW / PHONE.w);
      bm.style.transform = `scale(${s})`;
      devM.style.width = Math.ceil(PHONE.w * s) + 'px';
    }
    // Desktop: 1280 px breit, auf die verfügbare Breite skaliert
    if (view !== 'mobile') {
      const fd = document.getElementById('fit-desktop');
      const bd = document.getElementById('box-desktop');
      const s = Math.min(1, fd.clientWidth / DESK_W);
      bd.style.width = DESK_W + 'px';
      bd.style.height = Math.floor(fd.clientHeight / s) + 'px';
      bd.style.transform = `scale(${s})`;
    }
  }

  function setView(v) {
    if (!['both', 'desktop', 'mobile'].includes(v)) v = 'both';
    stage.dataset.view = v;
    document.querySelectorAll('.views button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
    history.replaceState(null, '', v === 'both' ? location.pathname + location.search : '#' + v);
    requestAnimationFrame(layout);
  }

  document.querySelectorAll('.views button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  document.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', () => {
    const f = document.getElementById('frame-' + b.dataset.reset);
    f.src = 'app.html?device=' + b.dataset.reset + '&r=' + Date.now();
  }));

  // Welcher Screen aus dem Design-Dokument gerade angezeigt wird
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.src !== 'mockup') return;
    const el = document.getElementById('scr-' + d.device);
    if (!el) return;
    const tag = d.id ? `<a href="${DESIGN}#${d.id}" target="_blank" rel="noopener" title="Im Design-Dokument ansehen">${d.id}</a>` : '<span class="new">neu</span>';
    el.innerHTML = `${tag}<span>${d.label.replace(/[<>&]/g, '')}</span>`;
    el.title = d.label;
  });

  window.addEventListener('resize', layout);
  setView(location.hash.slice(1));
})();
</script>
</body>
</html>
